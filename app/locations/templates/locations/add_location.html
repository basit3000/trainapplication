{% extends "base.html" %}

{% block title %}Add location{% endblock %}

{% block content %}
<div class="card card-narrow">
    <h2>Add a new location</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit" class="btn btn-primary">Add location</button>
            <a href="{% url 'locations:list' %}" class="btn btn-secondary">Back to locations</a>
        </div>
    </form>
</div>
{% endblock %}
