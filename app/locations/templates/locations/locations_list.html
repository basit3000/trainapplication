{% extends "base.html" %}

{% block content %}
<h2>These are the available locations:</h2>
    <ul>
        {% for location in locations %}
            <li>{{ location.name }}</li>
        {% endfor %}
    </ul>

{% if user.is_authenticated and user.is_staff %}
    <p><a href="{% url 'locations:add' %}">Add a new location</a></p>
{% endif %}   
 
{% endblock %}
