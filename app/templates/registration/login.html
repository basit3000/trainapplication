{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="card card-narrow">
    <h2>Log in</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <p class="muted mt-2 mb-0">Don't have an account? <a href="{% url 'register' %}">Register here</a>.</p>
</div>
{% endblock %}
