{% extends "base.html" %}

{% block title %}New ticket{% endblock %}

{% block content %}
<div class="card card-narrow">
    <h2>Create a new ticket</h2>
    <form action="{% url 'tickets.new' %}" method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>
{% endblock %}
