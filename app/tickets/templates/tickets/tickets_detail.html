{% extends "base.html" %}

{% block title %}{{ tickets.name }}{% endblock %}

{% block content %}
<div class="card card-narrow">
    <h2>{{ tickets.name }}</h2>
    <div class="actions">
        <a href="{% url 'tickets_delete' pk=tickets.id %}" class="btn btn-danger">Delete</a>
        <a href="{% url 'tickets_list' %}" class="btn btn-secondary">Back to tickets</a>
    </div>
</div>
{% endblock %}
