{% extends "base.html" %}

{% block title %}Buy tickets{% endblock %}

{% block content %}
<div class="card card-narrow">
    <h2>Buy a ticket</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Buy ticket</button>
    </form>
</div>
{% endblock %}
