{% extends "base.html" %}

{% block title %}Cancel ticket{% endblock %}

{% block content %}
<div class="card card-narrow">
    <h2>Cancel ticket</h2>
    <p>Are you sure you want to cancel "<strong>{{ usertickets.ticket.name }}</strong>"?</p>
    <p class="muted">This action can't be undone.</p>
    <form method="POST">
        {% csrf_token %}
        <div class="actions">
            <button type="submit" class="btn btn-danger">Confirm cancellation</button>
            <a href="{% url 'data' %}" class="btn btn-secondary">Keep ticket</a>
        </div>
    </form>
</div>
{% endblock %}
