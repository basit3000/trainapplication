{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="card card-narrow">
  <h2>Create your account</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Register</button>
  </form>
  <p class="muted mt-2 mb-0">Already have an account? <a href="{% url 'login' %}">Log in</a>.</p>
</div>
{% endblock %}
